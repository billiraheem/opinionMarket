<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/webp" href="/logo.webp" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpinionMarket — Predict & Trade on Real-World Events</title>
  <meta name="description"
    content="Trade on the outcomes of real-world events in politics, sports, entertainment, and economy with OpinionMarket." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script>
    // Prevent theme flash (default to light mode, dark is secondary)
    (function () {
      try {
        const theme = localStorage.getItem('om_theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (_) { }
    })();
  </script>
</head>

<body
  class="bg-light-bg text-slate-900 dark:bg-black dark:text-white antialiased selection:bg-brand-500 selection:text-white min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
